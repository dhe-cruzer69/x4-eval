name: Quality gates
on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e . && python -m pip install pytest ruff build
      - run: python -m pip check
      - name: Lint if configured
        run: if grep -q '\[tool\.ruff\]' pyproject.toml; then ruff check .; else echo 'SKIP: Ruff not configured'; fi
      - name: Test if tests exist
        run: if [ -d tests ] || find . -maxdepth 2 -type f -name 'test_*.py' -print -quit | grep -q .; then pytest -q; else echo 'SKIP: no Python tests discovered'; fi
      - run: python -m build --wheel
